name: Publish plugin

on:
  workflow_dispatch:
    inputs:
      plugin-id:
        description: Plugin directory suffix, for example space-designer
        required: true
        type: string
      version:
        description: Exact package version expected in package.json
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@minimalart'

      - name: Enable pnpm
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

      - name: Validate package selection
        env:
          PLUGIN_ID: ${{ inputs.plugin-id }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$PLUGIN_ID" =~ ^[a-z0-9-]+$ ]]; then
            echo "Invalid plugin id: $PLUGIN_ID" >&2
            exit 1
          fi

          PLUGIN_DIR="packages/plugins/plugin-$PLUGIN_ID"
          if [ "$PLUGIN_ID" = "runtime" ]; then PLUGIN_DIR="packages/contracts/plugin-runtime"; fi
          if [ "$PLUGIN_ID" = "analytics" ]; then PLUGIN_DIR="packages/contracts/analytics"; fi
          PACKAGE_JSON="$PLUGIN_DIR/package.json"
          test -f "$PACKAGE_JSON"

          node - "$PACKAGE_JSON" "$PLUGIN_ID" "$EXPECTED_VERSION" <<'NODE'
          const fs = require('node:fs')

          const [packageJsonPath, pluginId, expectedVersion] = process.argv.slice(2)
          const manifest = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'))
          const expectedName = pluginId === 'analytics' ? '@minimalart/mercatto-analytics-contract' : `@minimalart/mercatto-plugin-${pluginId}`

          if (manifest.name !== expectedName) {
            throw new Error(`Expected package ${expectedName}, found ${manifest.name}`)
          }
          if (manifest.version !== expectedVersion) {
            throw new Error(`Expected version ${expectedVersion}, found ${manifest.version}`)
          }
          if (manifest.private === true) {
            throw new Error(`${manifest.name} is private`)
          }
          NODE

      - name: Install
        if: inputs.plugin-id != 'runtime' && inputs.plugin-id != 'analytics'
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build
        env:
          PLUGIN_ID: ${{ inputs.plugin-id }}
        run: |
          if [ "$PLUGIN_ID" = "analytics" ]; then
            npm install --prefix packages/contracts/analytics --ignore-scripts --package-lock=false
            npm run build --prefix packages/contracts/analytics
            exit 0
          fi
          if [ "$PLUGIN_ID" = "runtime" ]; then
            npm install --prefix packages/contracts/plugin-runtime --ignore-scripts --legacy-peer-deps --package-lock=false
            npm run build --prefix packages/contracts/plugin-runtime
            npm test --prefix packages/contracts/plugin-runtime
            exit 0
          fi
          pnpm --filter "@minimalart/mercatto-plugin-${PLUGIN_ID}^..." build
          pnpm --dir "packages/plugins/plugin-$PLUGIN_ID" build

      - name: Pack
        env:
          PLUGIN_ID: ${{ inputs.plugin-id }}
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          PLUGIN_DIR="packages/plugins/plugin-$PLUGIN_ID"
          if [ "$PLUGIN_ID" = "runtime" ]; then PLUGIN_DIR="packages/contracts/plugin-runtime"; fi
          if [ "$PLUGIN_ID" = "analytics" ]; then
            PLUGIN_DIR="packages/contracts/analytics"
            npm pkg set 'repository.type=git' 'repository.url=git+https://github.com/minimalart/medusa-b2c-boilerplate.git' 'repository.directory=packages/contracts/analytics' --prefix "$PLUGIN_DIR"
          fi
          PACK_DIR="$RUNNER_TEMP/plugin-package"
          mkdir -p "$PACK_DIR"
          cd "$PLUGIN_DIR"
          pnpm pack --pack-destination "$PACK_DIR"
          PACKAGE_TARBALL="$(find "$PACK_DIR" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$PACKAGE_TARBALL"
          echo "PACKAGE_TARBALL=$PACKAGE_TARBALL" >> "$GITHUB_ENV"

      - name: Verify packed AI clients with central credentials
        if: inputs.plugin-id == 'banners' || inputs.plugin-id == 'landing-pages'
        env:
          PLUGIN_ID: ${{ inputs.plugin-id }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-package"
          pnpm --dir packages/contracts/plugin-runtime pack --pack-destination "$RUNNER_TEMP/runtime-package"
          RUNTIME_TARBALL="$(find "$RUNNER_TEMP/runtime-package" -name '*.tgz' -print -quit)"
          node --experimental-transform-types --import ./apps/backend/test-register.mjs \
            scripts/test-plugin-central-settings.ts "$RUNTIME_TARBALL" "$PACKAGE_TARBALL" "$PLUGIN_ID"

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish "$PACKAGE_TARBALL" --access restricted --registry https://npm.pkg.github.com

      - name: Verify published version
        env:
          PLUGIN_ID: ${{ inputs.plugin-id }}
          EXPECTED_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_NAME="@minimalart/mercatto-plugin-$PLUGIN_ID"
          if [ "$PLUGIN_ID" = "analytics" ]; then PACKAGE_NAME="@minimalart/mercatto-analytics-contract"; fi
          ACTUAL_VERSION="$(npm view "$PACKAGE_NAME@$EXPECTED_VERSION" version --registry https://npm.pkg.github.com)"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
          echo "$PACKAGE_NAME@$ACTUAL_VERSION is available in GitHub Packages"
          npm view "$PACKAGE_NAME@$EXPECTED_VERSION" dist --json --registry https://npm.pkg.github.com

      - name: Verify registry AI artifacts with central credentials
        if: inputs.plugin-id == 'banners' || inputs.plugin-id == 'landing-pages'
        env:
          PLUGIN_ID: ${{ inputs.plugin-id }}
          EXPECTED_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/registry-plugin" "$RUNNER_TEMP/registry-runtime"
          RUNTIME_VERSION="$(node -p "require('./packages/contracts/plugin-runtime/package.json').version")"
          npm pack "@minimalart/mercatto-plugin-runtime@$RUNTIME_VERSION" --ignore-scripts --pack-destination "$RUNNER_TEMP/registry-runtime"
          npm pack "@minimalart/mercatto-plugin-$PLUGIN_ID@$EXPECTED_VERSION" --ignore-scripts --pack-destination "$RUNNER_TEMP/registry-plugin"
          RUNTIME_TARBALL="$(find "$RUNNER_TEMP/registry-runtime" -name '*.tgz' -print -quit)"
          PLUGIN_TARBALL="$(find "$RUNNER_TEMP/registry-plugin" -name '*.tgz' -print -quit)"
          node --experimental-transform-types --import ./apps/backend/test-register.mjs \
            scripts/test-plugin-central-settings.ts "$RUNTIME_TARBALL" "$PLUGIN_TARBALL" "$PLUGIN_ID"
