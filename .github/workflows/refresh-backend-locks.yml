# Regenerates the backend lockfiles when a PR touches apps/backend/package.json,
# and COMMITS them back to the PR branch so the PR is mergeable on its own.
#
# WHY IT COMMITS AND NO LONGER JUST UPLOADS AN ARTIFACT. The Upgrade button in
# minimalart-version-checker opens plugin-bump PRs from a Supabase Edge
# Function (Deno), which cannot run pnpm/npm and therefore cannot produce
# `pnpm-lock.yaml` / `apps/backend/package-lock.json`. Without those two files
# `quality.yml` fails on `pnpm install --frozen-lockfile` and the PR can never
# go green. This job is the other half of that flow: it resolves the locks and
# pushes them onto the same branch, which is also exactly what a human wants
# when they bump a dependency by hand.
#
# THE BOT TOKEN IS LOAD-BEARING, and this is the one non-obvious part.
# A push made with the default `GITHUB_TOKEN` does NOT trigger new workflow
# runs — GitHub suppresses them on purpose to avoid recursion. So if we pushed
# the locks with `github.token`, `quality.yml` would keep showing the result
# from the lock-less commit, stay red, and auto-merge would never fire. Pushing
# with a PAT (`secrets.MERCATTO_BOT_TOKEN`) emits a real `synchronize` event,
# quality re-runs against the complete commit, and the PR can auto-merge.
#
# Without the secret the job still works — it resolves, verifies and uploads
# the locks as an artifact, and warns — but the PR then needs a human to add
# the locks (or any empty commit) to re-trigger the checks.
#
# IT ALSO MERGES, but only the checker's own upgrade PRs. GitHub's native
# auto-merge is not usable here: it refuses to engage on a PR that is already
# mergeable, and these repos have no required status checks, so a fresh PR is
# mergeable the instant it opens. Rather than put branch protection on `main`
# — which would also start blocking the direct `Auto commit` pushes and the
# deploy triggers — this job waits for the other checks itself and merges.
#
# The merge runs with the PAT and not with `github.token`, for the same
# suppression reason as the lock push: a merge performed by `github.token`
# would not trigger `deploy-backend.yml` on the resulting push to `main`, so
# the store would never actually deploy.
#
# Setup: create a fine-grained PAT on the store repos with
#   Contents:      Read and write   (push the lock commit)
#   Pull requests: Read and write   (merge the PR)
# and add it as an ORG-level Actions secret named MERCATTO_BOT_TOKEN so every
# current and future store inherits it.

name: Refresh backend locks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/backend/package.json
      - .github/workflows/refresh-backend-locks.yml

permissions:
  contents: write
  pull-requests: write
  packages: read

# The lock push emits a `synchronize`, and on `pull_request` the path filters
# above are evaluated against the whole PR diff — which still contains
# apps/backend/package.json — so this workflow re-triggers itself once. Let the
# newer run win: it sees the locks already current, waits for the checks on the
# new head, and merges. Without this both runs would sit in the wait loop and
# race to merge.
concurrency:
  group: refresh-backend-locks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  locks:
    # Las ramas `brick/*` las atiende `brick-locks.yml`, que hace lo mismo pero
    # sin la lógica de merge: una actualización de Brick la aprueba una persona
    # desde el checker, no se mergea sola. Sin este guard los dos jobs se
    # pisarían empujando locks al mismo commit.
    if: "!startsWith(github.head_ref, 'brick/')"
    runs-on: ubuntu-latest
    # `secrets` is not a context you can read from a step-level `if:`, so the
    # presence of the token is resolved once here into a plain env string.
    env:
      HAS_BOT_TOKEN: ${{ secrets.MERCATTO_BOT_TOKEN != '' }}
    steps:
      # `pull_request` checks out the merge commit in detached HEAD by default,
      # which cannot be pushed. Check out the head branch by name instead.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.MERCATTO_BOT_TOKEN || github.token }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable

      # Both .npmrc files (root and apps/backend) resolve the registry token
      # from ${GITHUB_TOKEN}, so that variable is the only lever here.
      #
      # PREFER THE PAT. The per-run Actions token (`ghs_`) can only read a
      # GitHub Packages package whose "Manage Actions access" list names this
      # repository, and a newly published plugin does NOT get that grant
      # automatically. That is exactly how
      # @minimalart/mercatto-plugin-space-designer took the lock refresh down on
      # all four stores at once with a 403, for days, while the boilerplate — the
      # repo that publishes it, and therefore the one repo with access — kept
      # passing. A user PAT reads org packages through the user's own access, so
      # no per-package grant is ever needed and every future plugin is covered.
      #
      # The Actions token stays as a FALLBACK, attempted only if the PAT run
      # fails. A missing or under-scoped PAT then leaves this job exactly as it
      # was rather than breaking resolution for every @minimalart package —
      # worth guarding, because GitHub Packages' npm registry has historically
      # wanted a CLASSIC PAT with read:packages and fine-grained support has
      # been uneven.
      - name: Resolve backend + workspace lockfiles
        env:
          BOT_TOKEN: ${{ secrets.MERCATTO_BOT_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          resolve () {
            npm install --prefix apps/backend --package-lock-only --ignore-scripts --no-audit --no-fund \
              && pnpm install --lockfile-only --ignore-scripts
          }

          if [ -n "${BOT_TOKEN}" ]; then
            echo "::group::Resolving with MERCATTO_BOT_TOKEN"
            if GITHUB_TOKEN="${BOT_TOKEN}" resolve; then
              echo "::endgroup::"
              echo "Resolved with the PAT."
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning title=PAT resolution failed::MERCATTO_BOT_TOKEN could not resolve the @minimalart scope; falling back to the per-run Actions token. If it is a fine-grained PAT, GitHub Packages npm may require a classic PAT with read:packages."
            # Drop any half-written lockfiles before retrying, so the fallback
            # starts from the committed state instead of the failed attempt's.
            git checkout -- pnpm-lock.yaml apps/backend/package-lock.json 2>/dev/null || true
          else
            echo "MERCATTO_BOT_TOKEN is empty — using the per-run Actions token."
          fi

          echo "::group::Resolving with the per-run Actions token"
          GITHUB_TOKEN="${ACTIONS_TOKEN}" resolve
          echo "::endgroup::"

      - run: node scripts/verify-backend-lock.js

      - name: Detect lock changes
        id: diff
        run: |
          if git diff --quiet -- pnpm-lock.yaml apps/backend/package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Locks already match apps/backend/package.json — nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- pnpm-lock.yaml apps/backend/package-lock.json
          fi

      - name: Commit refreshed locks to the PR branch
        if: github.event_name == 'pull_request' && steps.diff.outputs.changed == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "mercatto-bot"
          git config user.email "bot@minimalart.co"
          git add pnpm-lock.yaml apps/backend/package-lock.json
          git commit -m "chore(locks): refresh backend lockfiles"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
          if [ "$HAS_BOT_TOKEN" != "true" ]; then
            echo "::warning title=Checks will not re-run::Locks were pushed with the default GITHUB_TOKEN, which does not trigger new workflow runs. quality.yml still reflects the commit without the locks, so this PR cannot auto-merge. Add an org secret MERCATTO_BOT_TOKEN (fine-grained PAT, contents: write) to make this hands-off."
          fi

      # Merge — ONLY for the branches plugin-upgrade opens. Any other PR that
      # touches apps/backend/package.json is somebody's work in progress: it
      # gets its locks refreshed and nothing else. The branch prefix is the
      # contract, set in `branchName()` in the Edge Function.
      - name: Wait for the other checks and merge the upgrade PR
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'chore/plugin-upgrade-') &&
          env.HAS_BOT_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.MERCATTO_BOT_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          # Our own check is excluded from the gate for the obvious reason: it
          # is this job, and it cannot wait for itself.
          SELF="locks"

          # The lock push started a fresh set of check runs against a new head
          # sha. Poll until they exist, so we never read the previous head's
          # green result and merge a commit nobody checked.
          sleep 45

          deadline=$(( SECONDS + 25 * 60 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            checks=$(gh pr checks "$PR" --json name,bucket 2>/dev/null) || true
            [ -z "$checks" ] && checks='[]'

            others=$(printf '%s' "$checks" | jq -c --arg self "$SELF"               '[.[] | select(.name != $self)]')
            total=$(printf '%s'   "$others" | jq 'length')
            pending=$(printf '%s' "$others" | jq '[.[] | select(.bucket == "pending")] | length')
            broken=$(printf '%s'  "$others" | jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length')

            echo "checks (excluding ${SELF}): total=${total} pending=${pending} failing=${broken}"

            if [ "$broken" -gt 0 ]; then
              printf '%s' "$others" | jq -r                 '.[] | select(.bucket == "fail" or .bucket == "cancel") | "  \(.name): \(.bucket)"'
              echo "::error title=Upgrade PR not merged::A required check failed. The PR is left open with the locks committed so the failure can be read and fixed."
              exit 1
            fi

            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              if gh pr merge "$PR" --squash --delete-branch; then
                echo "PR #${PR} merged."
                exit 0
              fi
              echo "::error title=Merge refused::Checks are green but the merge call failed — most likely a conflict with main. Left open."
              exit 1
            fi

            sleep 20
          done

          echo "::warning title=Timed out waiting for checks::The locks are committed and the PR is mergeable by hand; nothing was merged automatically."

      # Kept as a fallback for workflow_dispatch runs and for the no-bot-token
      # case, where a human has to bring the locks in by hand.
      - uses: actions/upload-artifact@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          name: backend-locks
          path: |
            apps/backend/package-lock.json
            pnpm-lock.yaml
          retention-days: 3
