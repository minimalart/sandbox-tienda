services:
  db:
    image: postgres:15-alpine
    container_name: b2c-db
    # Opt-in only: by default Postgres comes from a native service (e.g. DBngin)
    # on the host. Start the containerized DB explicitly when there is no native
    # one: docker compose --profile docker-db up
    profiles: ['docker-db']
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 10s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mercatto
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/pg.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - b2c-network

  # Clon de la DB de prod para probar contra datos reales sin tocar prod. Vive
  # aislado del `db` de arriba (puerto/volumen distinto) para no pisar la DB de
  # dev habitual. Postgres 18 porque prod está en 18.6 y pg_restore de 15 no
  # entiende algunos cambios de schema (extensiones, catalogs).
  #
  # Se levanta bajo demanda con:
  #   docker compose --profile prod-clone up -d db-prod-clone
  # y el backend apunta acá con DATABASE_URL sobre localhost:55432.
  db-prod-clone:
    image: postgres:18-alpine
    container_name: b2c-db-prod-clone
    profiles: ['prod-clone']
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 10s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: educabot
    ports:
      - '55432:5432'
    # Postgres 18 cambió el layout: los datos van a un subdir versionado dentro
    # de /var/lib/postgresql (no directo en /data como en 15). Si se monta en
    # /var/lib/postgresql/data la imagen aborta con "unused mount/volume".
    volumes:
      - postgres_prod_clone_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - b2c-network

  redis:
    image: redis:7-alpine
    container_name: b2c-redis
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 10s
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - b2c-network

  typesense:
    image: typesense/typesense:27.1
    container_name: b2c-typesense
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 10s
    command: '--data-dir /data --api-key=dev_typesense_api_key --enable-cors'
    ports:
      - '8108:8108'
    volumes:
      - typesense_data:/data
    healthcheck:
      # /dev/tcp is a bash-ism — CMD-SHELL runs sh, so invoke bash explicitly
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/localhost/8108 && printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep -q ok',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - b2c-network

volumes:
  postgres_data:
    external: true
    name: infra_postgres_data
  redis_data:
    external: true
    name: infra_redis_data
  typesense_data:
    external: true
    name: infra_typesense_data
  # No es external: se crea en el primer up del profile prod-clone. Así el clon
  # de prod es descartable — `docker compose --profile prod-clone down -v` lo
  # borra sin afectar la DB de dev.
  postgres_prod_clone_data:

networks:
  b2c-network:
    driver: bridge
